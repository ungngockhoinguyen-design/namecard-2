<title>Ung Ngọc Khôi Nguyên – Unit Manager, Asahi Life</title>
<meta name="description" content="Danh thiếp điện tử của Ung Ngọc Khôi Nguyên, Unit Manager tại Asahi Life.">

<style>
:root{
  --navy:#081540; --accent:#D90A4A; --pink:#FFC8D8; --mist:#D6E4F7;
  --serif:'Cormorant Garamond','Times New Roman',Georgia,serif;
  --sans:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:#17408f;color:#fff;font-family:var(--sans);-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
.card{
  min-height:100dvh;max-width:440px;margin:0 auto;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 40px) 28px calc(env(safe-area-inset-bottom,0px) + 28px);
}
.portrait{
  position:relative;width:min(70%,270px);aspect-ratio:4/5;margin:0 auto;
  border-radius:999px 999px 28px 28px;animation:rise .8s ease-out both;
}
.sun{
  position:absolute;z-index:0;width:56%;aspect-ratio:1;top:-8%;right:-26%;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#F23A72,var(--accent) 68%);
  box-shadow:0 0 70px rgba(217,10,74,.5);
}
.portrait::before{
  content:"";position:absolute;z-index:2;inset:-10px;border:1px solid rgba(255,255,255,.6);
  border-radius:999px 999px 36px 36px;pointer-events:none;
}
.portrait img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
h1{
  font-family:var(--serif);font-weight:700;font-size:clamp(2.1rem,9.5vw,2.6rem);line-height:1.08;
  text-align:center;text-wrap:balance;margin:36px 0 10px;text-shadow:0 2px 18px rgba(8,21,64,.4);
}
.role{text-align:center;color:var(--pink);font-weight:600;font-size:1.05rem;letter-spacing:.02em}
.org{text-align:center;color:var(--mist);font-size:.95rem;margin-top:4px}
.panel{
  margin-top:30px;padding:4px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.22);
  background:rgba(8,21,64,.5);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
}
.contacts{list-style:none;padding:0}
.contacts li+li{border-top:1px solid rgba(255,255,255,.16)}
.contacts a{
  display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;
  padding:14px 0;color:#fff;text-decoration:none;
}
.ico{width:44px;height:44px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff}
.ico svg{width:20px;height:20px}
.lbl{display:block;color:var(--mist);font-size:.8rem;margin-bottom:2px}
.val{display:block;font-size:1.05rem;overflow-wrap:anywhere}
.action{margin-top:auto;padding-top:28px}
#save{
  width:100%;min-height:58px;border:0;border-radius:16px;background:var(--accent);color:#fff;
  font:600 1.05rem var(--sans);display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;
  box-shadow:0 10px 28px rgba(217,10,74,.4);transition:transform .12s ease;
}
#save svg{width:22px;height:22px}
#save:active{transform:scale(.98)}
a:focus-visible,#save:focus-visible{outline:3px solid var(--navy);outline-offset:3px;border-radius:12px}
#note{text-align:center;color:var(--navy);font-weight:500;font-size:.85rem;line-height:1.5;min-height:1.5em;margin-top:12px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.portrait{animation:none}#save{transition:none}}
</style>
</head>

      fold("PHOTO;ENCODING=b;TYPE=JPEG:" + PHOTO_B64),
      "END:VCARD"
    ].join("\r\n") + "\r\n";
  }

  var note = document.getElementById("note");
  var ua = navigator.userAgent;
  var isIOS = /iP(hone|ad|od)/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var inApp = /FBAN|FBAV|Zalo|Instagram|Line\//i.test(ua);

  if (inApp) {
    note.textContent = "Nếu nút không hoạt động, hãy mở trang này bằng Safari hoặc Chrome.";
  }

  document.getElementById("save").addEventListener("click", function () {
    try {
      var blob = new Blob([buildVCard()], { type: "text/vcard;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      if (!isIOS) a.download = FILE_NAME;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
      note.textContent = isIOS
        ? "Chọn “Tạo liên hệ mới” để lưu vào danh bạ."
        : "Đã tạo danh bạ. Mở file vừa tải để lưu vào điện thoại.";
    } catch (e) {
      note.textContent = "Không tạo được file danh bạ. Vui lòng thử lại bằng Safari hoặc Chrome.";
    }
  });
})();
</script>
